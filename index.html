<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@300;400&display=swap">
<style>
:root{--sky1:#120a24;--sky2:#2a1141;--glow:#5a1d4d;--rose:#ff7a9c;--gold:#ffd9a0;--text:#fff1f4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme=sunset]{--sky1:#2a0b33;--sky2:#7a2150;--glow:#ff7a4d;--rose:#ff9d8a;--gold:#ffe8a8}
html[data-theme=ocean]{--sky1:#041428;--sky2:#0b3a5c;--glow:#127a8f;--rose:#8fe9ff;--gold:#e6fbff}
html[data-theme=garden]{--sky1:#0a1a12;--sky2:#1d4a33;--glow:#3f7d4a;--rose:#ffa3c8;--gold:#f6ffc4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 120%,var(--glow) 0%,var(--sky2) 40%,var(--sky1) 100%);color:var(--text);font-family:'Jost','Helvetica Neue',Arial,sans-serif;font-weight:300;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;pointer-events:none}
#line{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:clamp(2rem,7vw,4.2rem);line-height:1.3;max-width:15em;opacity:0;filter:blur(10px);transform:scale(.96);transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease;text-shadow:0 0 30px color-mix(in srgb,var(--rose) 55%,transparent)}
#line.on{opacity:1;filter:blur(0);transform:scale(1)}
#line.big{font-size:clamp(2.6rem,10vw,6rem);color:var(--gold);text-shadow:0 0 40px color-mix(in srgb,var(--gold) 70%,transparent)}
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:2rem;background:radial-gradient(ellipse at 50% 120%,var(--glow),var(--sky1) 70%);transition:opacity 1.4s ease}
#gate.out{opacity:0;pointer-events:none}
#gate h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.4rem,9vw,4.5rem);margin:0;color:var(--gold)}
#gate p{margin:0;opacity:.8;font-size:1.05rem}
input{font:inherit;font-size:1.2rem;text-align:center;color:var(--text);background:transparent;border:0;border-bottom:1px solid color-mix(in srgb,var(--gold) 60%,transparent);padding:.5rem 1rem;width:min(18rem,80vw);outline:none}
input:focus-visible{border-bottom-color:var(--rose);box-shadow:0 8px 20px -12px var(--rose)}
button{font:inherit;cursor:pointer;color:#2a0f2e;background:linear-gradient(135deg,var(--rose),var(--gold));border:0;border-radius:999px;padding:.8rem 2.2rem;font-size:1.05rem;letter-spacing:.04em}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#gate button{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 30px color-mix(in srgb,var(--rose) 60%,transparent)}}
#ui{position:fixed;left:0;right:0;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;z-index:3;opacity:0;pointer-events:none;transition:opacity .5s ease}
#ui.open{opacity:1;pointer-events:auto}
#menu{position:fixed;top:calc(.8rem + env(safe-area-inset-top,0px));right:.8rem;z-index:4;width:2.4rem;height:2.4rem;padding:0;background:transparent;color:var(--rose);opacity:.3;font-size:1.2rem;border-radius:50%;transition:opacity .3s}
#menu:hover,#menu:focus-visible{opacity:1}
#ui button{background:rgba(255,255,255,.12);color:var(--text);padding:.6rem 1.3rem;font-size:.95rem;backdrop-filter:blur(6px)}
#shower,#another,#play,#wand{display:none}
#magic{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 30%,var(--sky2),var(--sky1) 75%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;text-align:center;padding:2rem;overflow:hidden}
#magic.on{display:flex}
#mtext{font-family:'Pinyon Script',cursive;font-size:clamp(1.9rem,6vw,3rem);margin:0;max-width:16em;min-height:2.6em;text-shadow:0 0 24px color-mix(in srgb,var(--rose) 50%,transparent)}
.cards{display:flex;gap:clamp(.6rem,3vw,1.4rem);perspective:900px}
.card{width:min(27vw,150px);aspect-ratio:2/3;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .9s ease;outline:none}
.card:hover:not(.flip){transform:translateY(-8px)}
.card:focus-visible{box-shadow:0 0 0 2px var(--gold);border-radius:14px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:.6rem;text-align:center;font-size:clamp(.72rem,2.6vw,.95rem);line-height:1.35}
.back{background:linear-gradient(135deg,var(--glow),var(--sky2));border:1px solid var(--gold);color:var(--gold);font-size:2.2rem}
.front{transform:rotateY(180deg);background:linear-gradient(135deg,var(--rose),var(--gold));color:#2a0f2e;font-weight:400}
#mbtn{display:none;gap:.8rem}
#mbtn.on{display:flex}
.spark{position:absolute;pointer-events:none;font-size:18px;z-index:8}
#pick{position:fixed;left:0;right:0;bottom:calc(7rem + env(safe-area-inset-bottom,0px));text-align:center;padding:0 1.5rem;font-size:clamp(1rem,3.5vw,1.3rem);color:var(--gold);opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease;z-index:3;pointer-events:none}
#pick.on{opacity:1;transform:none}
#game{position:fixed;inset:0;z-index:6;background:color-mix(in srgb,var(--sky1) 93%,transparent);display:none}
#game.on{display:block}
#gc{touch-action:none;cursor:pointer}
#ghud{position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 1.5rem;font-size:1.4rem;color:var(--gold);pointer-events:none}
#gend{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
#gend.on{display:flex}
#gend p{font-family:'Pinyon Script',cursive;font-size:clamp(2rem,7vw,3.4rem);margin:0 0 .5rem;max-width:14em}
@media (prefers-reduced-motion:reduce){#gate button{animation:none}#line{transition:opacity .4s}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stage"><div id="line" aria-live="polite"></div></div>
<button id="menu" aria-label="Show or hide buttons" aria-expanded="false">♥</button>
<div id="pick" aria-live="polite"></div>
<div id="game"><canvas id="gc"></canvas><div id="ghud"><span id="gscore">Hearts: 0</span><span id="gtime">30</span></div><div id="gend"><p id="gmsg"></p><button id="again">Play again</button><button id="close">Close</button></div></div>
<div id="magic"><p id="mtext"></p><div class="cards" id="cards"></div><div id="mbtn"><button id="magain">Again</button><button id="mclose">Close</button></div></div>
<div id="ui"><button id="wand">Magic</button><button id="play">Play a game</button><button id="another">Pickup line</button><button id="shower">Shower of hearts</button><button id="theme">Theme</button><button id="mute" aria-label="Mute music">Music on</button></div>
<div id="gate">
  <h1>I made this for you</h1>
  <p>Turn your sound on, then type your name.</p>
  <input id="name" placeholder="Your name" autocomplete="off" aria-label="Your name">
  <button id="go">Open</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,D=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();

/* ---------- visuals ---------- */
const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,p:Math.random()*6}));
const C={rose:'#ff7a9c',gold:'#ffd9a0'};
let hearts=[],heartMode=false,beat=0;
const N=320,pts=[];
for(let i=0;i<N;i++){const t=i/N*Math.PI*2;pts.push([16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))])}
const dust=Array.from({length:N},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,a:Math.random()*6,i}));
const pointer={x:-999,y:-999};
addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});

function spawnHeart(x,y,burst){
  hearts.push({x:x??Math.random()*W,y:y??H+20,s:Math.random()*16+10,vy:burst?-(Math.random()*3+1.5):-(Math.random()*.8+.4),vx:burst?(Math.random()-.5)*4:(Math.random()-.5)*.3,a:burst?1:.55,life:burst?1:0,w:Math.random()*6});
}
let T=0;
function frame(){
  T+=.016;
  g.globalAlpha=1;g.clearRect(0,0,W,H);
  for(const s of stars){
    const a=.35+.65*Math.abs(Math.sin(T*.8+s.p));
    g.fillStyle=`rgba(255,240,225,${a})`;
    g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,6.3);g.fill();
  }
  if(!heartMode&&Math.random()<.04)spawnHeart();
  g.textAlign='center';g.textBaseline='middle';
  hearts=hearts.filter(h=>h.y>-40&&h.a>.01);
  for(const h of hearts){
    h.x+=h.vx+Math.sin(T*2+h.w)*.3;h.y+=h.vy;
    if(h.life){h.vy+=.03;h.a-=.006}
    g.globalAlpha=Math.max(h.a,0);g.fillStyle=C.rose;g.font=`${h.s}px serif`;g.fillText('♥',h.x,h.y);
  }
  g.globalAlpha=1;
  beat=heartMode?1+.06*Math.pow(Math.abs(Math.sin(T*2.2)),6):1;
  const sc=Math.min(W,H)/42*(heartMode?1:.9);
  const cx=W/2,cy=H/2-(heartMode?H*.04:0);
  for(const d of dust){
    let tx,ty;
    if(heartMode){tx=cx+pts[d.i][0]*sc*beat;ty=cy+pts[d.i][1]*sc*beat;
      d.vx+=(tx-d.x)*.012;d.vy+=(ty-d.y)*.012}
    else{d.a+=.004;d.vx+=Math.cos(d.a+d.i)*.012;d.vy+=Math.sin(d.a*1.3+d.i)*.012-.002;
      if(d.y<-10)d.y=H+10;if(d.x<-10)d.x=W+10;if(d.x>W+10)d.x=-10}
    const dx=d.x-pointer.x,dy=d.y-pointer.y,q=dx*dx+dy*dy;
    if(q<9000){const f=(1-q/9000)*.8;d.vx+=dx*f*.02;d.vy+=dy*f*.02}
    d.vx*=heartMode?.9:.97;d.vy*=heartMode?.9:.97;d.x+=d.vx;d.y+=d.vy;
    g.fillStyle=heartMode?C.rose:C.gold;g.globalAlpha=heartMode?.95:.55;
    g.beginPath();g.arc(d.x,d.y,heartMode?2.4:1.5,0,6.3);g.fill();
  }
  requestAnimationFrame(frame);
}
frame();

/* ---------- themes ---------- */
const THEMES=['night','sunset','ocean','garden'],TN={night:'Night sky',sunset:'Sunset',ocean:'Ocean',garden:'Garden'};
let ti=0;
function applyTheme(){
  document.documentElement.dataset.theme=THEMES[ti];
  const s=getComputedStyle(document.documentElement);
  C.rose=s.getPropertyValue('--rose').trim();C.gold=s.getPropertyValue('--gold').trim();
  document.getElementById('theme').textContent='Theme: '+TN[THEMES[ti]];
}
document.getElementById('theme').onclick=()=>{ti=(ti+1)%THEMES.length;applyTheme()};
applyTheme();

/* ---------- music: original melody, synthesized ---------- */
let ctx,master,muted=false;
const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mel=[[76,0,0,72,0,74,76,0],[77,0,0,76,0,72,0,0],[79,0,0,76,0,72,74,76],[74,0,0,71,0,74,0,0]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,dur,v){
  [[1,'sine',1],[2,'triangle',.25],[3,'sine',.08]].forEach(([k,type,w])=>{
    const o=ctx.createOscillator(),e=ctx.createGain();
    o.type=type;o.frequency.value=hz(m)*k;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v*w,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(e);e.connect(master);o.start(t);o.stop(t+dur+.05);
  });
}
function startMusic(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=.5;
  const dl=ctx.createDelay(1),fb=ctx.createGain(),wet=ctx.createGain();
  dl.delayTime.value=.37;fb.gain.value=.38;wet.gain.value=.4;
  master.connect(ctx.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ctx.destination);
  let step=0,next=ctx.currentTime+.15;const dur=.4;
  setInterval(()=>{
    while(next<ctx.currentTime+.6){
      const bar=Math.floor(step/8)%4,s=step%8,ch=chords[bar];
      if(s===0){note(ch[0]-12,next,3,.35);note(ch[0],next,2.8,.12)}
      note(ch[[0,1,2,1,2,1,2,1][s]]+12,next,.9,.16);
      const m=mel[bar][s];if(m)note(m,next,1.4,.28);
      next+=dur;step++;
    }
  },100);
}
document.getElementById('mute').onclick=e=>{
  if(!ctx)return;muted=!muted;
  muted?ctx.suspend():ctx.resume();
  e.target.textContent=muted?'Music off':'Music on';
};

/* ---------- story ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const line=document.getElementById('line');
async function say(t,hold=3200,big=false){
  line.className=big?'big':'';line.textContent=t;
  void line.offsetWidth;line.classList.add('on');
  await sleep(hold);
  line.classList.remove('on');await sleep(1500);
}
const PICKS=[
  'Are you a magnet? Because I’m completely attracted to you.',
  'Do you have a map? I keep getting lost in your eyes.',
  'Is your name Wi-Fi? Because I’m feeling a real connection.',
  'Are you a camera? Every time I look at you, I smile.',
  'Are you a charger? Because I’m nothing without you.',
  'Do you believe in love at first sight, or should I walk by again?',
  'If you were a song, you’d be the one I replay forever.',
  'Is it hot in here, or is it just you?'
];
let pi=0;
async function story(n){
  await sleep(1200);
  await say(`Hi, ${n}.`,2600);
  await say('I made you a tiny corner of the internet.');
  await say('Some feelings don’t fit inside a text message.',3600);
  await say('You make ordinary days feel like they’re glowing.',3800);
  await say('Thank you for being exactly you.',3400);
  await say('Okay, one more thing. I practiced these.',3000);
  for(const p of PICKS.slice(0,4)){await say(p,4200);}
  pi=4;
  await say('Did it work?',2600);
  heartMode=true;
  await sleep(2800);
  line.className='big';line.textContent=`I love you, ${n}`;
  void line.offsetWidth;line.classList.add('on');
  document.getElementById('shower').style.display='inline-block';
  document.getElementById('another').style.display='inline-block';
  document.getElementById('play').style.display='inline-block';
  document.getElementById('wand').style.display='inline-block';
  setInterval(()=>{if(Math.random()<.5)spawnHeart(W/2+(Math.random()-.5)*W*.6,H*.9,true)},900);
}
document.getElementById('another').onclick=async()=>{
  const el=document.getElementById('pick');
  el.classList.remove('on');await sleep(400);
  el.textContent=PICKS[pi%PICKS.length];pi++;
  el.classList.add('on');
};
document.getElementById('shower').onclick=()=>{
  for(let i=0;i<70;i++)setTimeout(()=>spawnHeart(Math.random()*W,H+10,true),i*35);
};
addEventListener('pointerdown',e=>{if(heartMode)for(let i=0;i<8;i++)spawnHeart(e.clientX,e.clientY,true)});

/* ---------- game: catch the hearts ---------- */
const gm=document.getElementById('game'),gc=document.getElementById('gc'),gx=gc.getContext('2d');
let G=null;
function startGame(){
  gc.width=W*D;gc.height=H*D;gx.setTransform(D,0,0,D,0,0);
  gm.classList.add('on');document.getElementById('gend').classList.remove('on');
  G={t:30,score:0,items:[],pops:[],sp:0,last:performance.now(),over:false};
  document.getElementById('gscore').textContent='Hearts: 0';
  requestAnimationFrame(gloop);
}
function gloop(now){
  if(!G||!gm.classList.contains('on'))return;
  const dt=Math.min((now-G.last)/1000,.05);G.last=now;
  if(!G.over){
    G.t-=dt;
    G.sp-=dt;
    if(G.sp<=0){const e=30-G.t;G.sp=Math.max(.3,.8-e*.015);
      G.items.push({x:Math.random()*(W-80)+40,y:-30,v:110+e*7+Math.random()*60,s:36+Math.random()*16,bad:Math.random()<.15,w:Math.random()*6})}
    G.items.forEach(i=>{i.y+=i.v*dt;i.x+=Math.sin(now/500+i.w)*.6});
    G.items=G.items.filter(i=>i.y<H+40);
    document.getElementById('gtime').textContent=Math.max(0,Math.ceil(G.t))+'s';
    if(G.t<=0)endGame();
  }
  gx.clearRect(0,0,W,H);gx.textAlign='center';gx.textBaseline='middle';
  G.items.forEach(i=>{gx.font=i.s+'px serif';gx.fillStyle=C.rose;gx.fillText(i.bad?'\u{1F494}':'\u2665',i.x,i.y)});
  G.pops=G.pops.filter(p=>p.a>0);
  G.pops.forEach(p=>{p.y-=1;p.a-=.02;gx.globalAlpha=p.a;gx.fillStyle=p.c;gx.font='22px Jost,sans-serif';gx.fillText(p.t,p.x,p.y)});
  gx.globalAlpha=1;
  requestAnimationFrame(gloop);
}
function endGame(){
  G.over=true;
  const s=G.score;
  document.getElementById('gmsg').textContent=`You caught ${s} heart${s===1?'':'s'}. You already have mine.`;
  document.getElementById('gend').classList.add('on');
}
gc.addEventListener('pointerdown',e=>{
  if(!G||G.over)return;
  const x=e.clientX,y=e.clientY;
  for(let k=G.items.length-1;k>=0;k--){const i=G.items[k];
    if(Math.hypot(i.x-x,i.y-y)<i.s*.9){
      G.items.splice(k,1);
      G.score=Math.max(0,G.score+(i.bad?-2:1));
      G.pops.push({x:i.x,y:i.y,a:1,t:i.bad?'-2':'+1',c:i.bad?'#aab':C.gold});
      document.getElementById('gscore').textContent='Hearts: '+G.score;
      break}}
});
document.getElementById('play').onclick=startGame;
document.getElementById('again').onclick=startGame;
document.getElementById('close').onclick=()=>{gm.classList.remove('on');G=null};

/* ---------- magic: pick a card ---------- */
const mg=document.getElementById('magic'),cards=document.getElementById('cards'),mtext=document.getElementById('mtext'),mbtn=document.getElementById('mbtn');
const MS=['You picked me. I knew you would.','Every card says you’re stuck with me.','The magic was you all along.','Plot twist: this card is me too.'];
let picked=false,lastSpark=0;
function sparkle(x,y){
  const s=document.createElement('span');s.className='spark';s.textContent=Math.random()<.5?'\u2728':'\u2726';
  s.style.left=x+'px';s.style.top=y+'px';s.style.color='#ffd9a0';mg.appendChild(s);
  const dx=(Math.random()-.5)*70,dy=Math.random()*60+10;
  s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.3)`,opacity:0}],{duration:900,easing:'ease-out'}).onfinish=()=>s.remove();
}
mg.addEventListener('pointermove',e=>{const n=performance.now();if(n-lastSpark>60){lastSpark=n;sparkle(e.clientX,e.clientY)}});
function deal(){
  picked=false;mbtn.classList.remove('on');cards.innerHTML='';
  mtext.textContent='Think of someone. I’ll read your mind. Pick a card.';
  [...MS].sort(()=>Math.random()-.5).slice(0,3).forEach(m=>{
    const c=document.createElement('div');c.className='card';c.tabIndex=0;c.setAttribute('role','button');c.setAttribute('aria-label','Card');
    c.innerHTML=`<div class="face back">\u2665</div><div class="face front">${m}</div>`;
    c.onclick=()=>pick(c);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(c)}};
    cards.appendChild(c);
  });
}
function pick(c){
  if(picked)return;picked=true;c.classList.add('flip');
  mtext.textContent='You were thinking of me, weren’t you?';
  const r=c.getBoundingClientRect();
  for(let i=0;i<24;i++)setTimeout(()=>sparkle(r.left+Math.random()*r.width,r.top+Math.random()*r.height),i*40);
  setTimeout(()=>{[...cards.children].forEach(x=>x.classList.add('flip'));mtext.textContent='Every card was me. That’s the trick.';mbtn.classList.add('on')},2200);
}
document.getElementById('wand').onclick=()=>{mg.classList.add('on');deal()};
document.getElementById('magain').onclick=deal;
document.getElementById('mclose').onclick=()=>mg.classList.remove('on');

document.getElementById('menu').onclick=e=>{
  const o=document.getElementById('ui').classList.toggle('open');
  e.currentTarget.setAttribute('aria-expanded',o);
};

function begin(){
  const n=document.getElementById('name').value.trim()||'my love';
  document.getElementById('gate').classList.add('out');
  startMusic();story(n);
}
document.getElementById('go').onclick=begin;
document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});
</script>
</body>
</html>
